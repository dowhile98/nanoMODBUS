# Interrupt-driven receive keeps the client usable while it sleeps between
# polls, without requiring DMA-capable (non-cacheable) buffers. No STM32F1
# UART node exposes DMA channels, so "auto" would resolve here as well; the
# overlay states it explicitly.
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y
