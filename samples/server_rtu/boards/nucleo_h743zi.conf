CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_ASYNC_API=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y

# The asynchronous RX buffers live in the transport structure (.bss). The STM32
# UART driver rejects DMA buffers that are not in a non-cacheable region, so
# disable the data cache here to exercise the DMA receive path. Set this back to
# y and let select_rx_mode() fall back to IRQ reception if the application must
# keep the cache enabled.
CONFIG_DCACHE=n
