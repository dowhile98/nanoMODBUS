# The STM32F1 UART nodes expose no DMA channels, so the asynchronous receive
# path is unavailable and the server runs on interrupt-driven reception. There
# is no data cache on Cortex-M3 either, so none of the H743 DMA settings apply.
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y
