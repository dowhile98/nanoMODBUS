CONFIG_NANOMODBUS=y
CONFIG_NANOMODBUS_CLIENT=y
CONFIG_NANOMODBUS_SERVER=n
CONFIG_NANOMODBUS_TRANSPORT_TCP=y
CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_TCP=y
CONFIG_NET_IPV4=y
CONFIG_LOG=y

# main() owns the TCP client state in static storage; the extra headroom covers
# the socket call chain (connect/poll) on top of the logging calls.
CONFIG_MAIN_STACK_SIZE=2048
