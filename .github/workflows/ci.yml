name: ci

on:
  push:
    branches:
      - master
      - 'feature/**'
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned Zephyr release used to build the module and run the Ztest suite.
  # Bump together with the local west workspace to keep parity.
  ZEPHYR_VERSION: v4.4.2

jobs:
  host:
    name: Host CMake build and tests
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTS=ON -DBUILD_EXAMPLES=ON -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  zephyr:
    name: Zephyr module (native_sim)
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install west and native_sim build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build
          python -m pip install --upgrade pip
          python -m pip install west
      - name: Fetch Zephyr workspace
        run: |
          west init -m https://github.com/zephyrproject-rtos/zephyr --mr "$ZEPHYR_VERSION" "$RUNNER_TEMP/zephyrproject"
          cd "$RUNNER_TEMP/zephyrproject"
          west update --narrow -o=--depth=1
          python -m pip install -r zephyr/scripts/requirements.txt
      - name: Run Ztest suite on native_sim
        run: |
          cd "$RUNNER_TEMP/zephyrproject/zephyr"
          west twister -T "$GITHUB_WORKSPACE/tests/zephyr" -p native_sim \
            --extra-args ZEPHYR_MODULES="$GITHUB_WORKSPACE" \
            -O "$RUNNER_TEMP/twister-out" --inline-logs

  examples-arduino:
    name: Examples (Arduino AVR)
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@v4
      - name: Install arduino-cli
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh -s -- -b "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Build Arduino examples
        run: ./examples/arduino/compile-examples.sh

  examples-rp2040:
    name: Examples (RP2040)
    # Pinned: the runner image ships gcc-arm-none-eabi 13.x. GCC 14+ switches to
    # C23 and rejects the implicit declarations still present in these examples.
    runs-on: ubuntu-24.04
    steps:
      - name: Clone repo
        uses: actions/checkout@v4
      - name: Cache pico-sdk
        uses: actions/cache@v4
        with:
          path: examples/rp2040/pico-sdk
          key: pico-sdk-${{ runner.os }}
      - name: Install ARM dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake gcc-arm-none-eabi libnewlib-arm-none-eabi build-essential
      - name: Build rp2040 examples
        working-directory: examples/rp2040
        run: |
          if [ ! -d pico-sdk ]; then
            git clone --depth=1 https://github.com/raspberrypi/pico-sdk.git
          fi
          cmake -S . -B build -DPICO_SDK_PATH="$PWD/pico-sdk"
          cmake --build build --parallel

  examples-stm32:
    name: Examples (STM32)
    # Pinned for the same gcc-arm-none-eabi 13.x reason as examples-rp2040.
    runs-on: ubuntu-24.04
    steps:
      - name: Clone repo
        uses: actions/checkout@v4
      - name: Install ARM dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake gcc-arm-none-eabi libnewlib-arm-none-eabi build-essential
      - name: Build stm32 examples
        working-directory: examples/stm32
        run: |
          cmake -S . -B build
          cmake --build build
